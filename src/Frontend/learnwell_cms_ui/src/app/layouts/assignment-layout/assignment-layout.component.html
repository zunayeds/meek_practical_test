<div class="page-header">
  <div class="flex align-items-center gap-2">
    <p-button icon="pi pi-arrow-left" severity="secondary" size="small" (onClick)="onCancel()" />
    <h2 class="page-title">{{ title() }} — {{ itemName() }}</h2>
  </div>
</div>

<p-card>
  <app-pick-list
    [sourceItems]="sourceItems()"
    [targetItems]="targetItems()"
    [sourcePage]="sourcePage()"
    [sourceHasMore]="sourceHasMore()"
    [loading]="loadingSource()"
    (targetChange)="onTargetChange($event)"
    (pageChange)="onPageChange($event)" />

  <div class="form-actions">
    <p-button label="Cancel" icon="pi pi-times" severity="secondary" (onClick)="onCancel()" />
    <p-button label="Save" icon="pi pi-check" severity="primary" [disabled]="loadingSource()" (onClick)="onSave()" [loading]="saving()" />
  </div>
</p-card>
