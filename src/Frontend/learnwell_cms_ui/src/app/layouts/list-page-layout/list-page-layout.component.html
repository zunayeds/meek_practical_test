<div class="page-header">
  <h2 class="page-title">{{ title() }}</h2>
  @if (canCreate()) {
    <p-button [label]="'Add ' + entity()" icon="pi pi-plus" (onClick)="onCreate()" />
  }
</div>

<div class="filter-bar">
  <ng-content select="[list-filters]"></ng-content>
  <p-button label="Search" icon="pi pi-search" (onClick)="search.emit()" />
  <p-button label="Clear" icon="pi pi-times" severity="secondary" (onClick)="clearFilters.emit()" />
</div>

<app-list-table
  [items]="items()"
  [loading]="loading()"
  [columns]="columns()"
  [pageSize]="pageSize()"
  [totalRecords]="totalRecords()"
  [extraActionsTemplate]="extraActionsTemplate()?.template ?? null"
  [paginationEnabled]="true"
  [isLazyLoad]="true"
  (lazyLoad)="lazyLoad.emit($event)"
  (onView)="onView($event)"
  (onEdit)="onEdit($event)"
  (onDelete)="onDelete($event)">
</app-list-table>

<app-confirm-delete-dialog
  [visible]="isDeleteDialogVisible()"
  (visibleChange)="isDeleteDialogVisible.set($event)"
  [loading]="deleteLoading()"
  [message]="'Are you sure you want to delete this ' + (entity() | lowercase) + '?'"
  (confirmed)="onDeleteConfirmed()"
  (cancelled)="isDeleteDialogVisible.set(false)" />
