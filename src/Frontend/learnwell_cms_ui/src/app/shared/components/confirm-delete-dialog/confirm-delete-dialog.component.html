<p-dialog
  header="Confirm Delete"
  [visible]="visible()"
  [modal]="true"
  [closable]="!loading"
  [style]="{ width: '420px' }"
  (onHide)="onCancel()">

  <p class="m-0">{{ message() }}</p>

  <ng-template pTemplate="footer">
    <p-button
      label="Cancel"
      icon="pi pi-times"
      severity="secondary"
      [disabled]="loading()"
      (onClick)="onCancel()" />
    <p-button
      label="Delete"
      icon="pi pi-trash"
      severity="danger"
      [loading]="loading()"
      (onClick)="onConfirm()" />
  </ng-template>
</p-dialog>
