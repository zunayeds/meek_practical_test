<app-list-page-layout
  [title]="'Students'"
  [entity]="'Student'"
  [idField]="'studentId'"
  [items]="students()"
  [columns]="columns()"
  [loading]="loading()"
  [totalRecords]="totalRecords()"
  [pageSize]="pageSize"
  [emptyMessage]="'No students found.'"
  (lazyLoad)="onLazyLoad($event)"
  (search)="search()"
  (clearFilters)="clearFilters()"
  [canCreate]="true"
  [baseRoute]="'staff/students'"
  [service]="studentService">

  <div list-filters class="filter-bar-content">
    <input
      pInputText
      [(ngModel)]="nameFilter"
      placeholder="Search by name"
      (keyup.enter)="search()" />
    <input
      pInputText
      [(ngModel)]="emailFilter"
      placeholder="Search by email"
      (keyup.enter)="search()" />
    <input
      pInputText
      [(ngModel)]="phoneNumberFilter"
      placeholder="Search by phone number"
      (keyup.enter)="search()" />
  </div>
</app-list-page-layout>
